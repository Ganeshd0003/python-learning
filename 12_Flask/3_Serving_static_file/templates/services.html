<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Services</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
      <div class="container-fluid">
        <img
          src="{{ url_for('static', filename='images/logo.png') }}"
          alt="Logo"
          width="30"
          height="24"
        />
        <a class="navbar-brand" href="#">Flask Serving Static</a>

        <div class="collapse navbar-collapse">
          <div class="navbar-nav">
            <a class="nav-link" href="/">Home</a>
            <a class="nav-link active" href="/services">Services</a>
            <a class="nav-link" href="/about">About</a>
            <a class="nav-link" href="/contact">Contact</a>
          </div>
        </div>
      </div>
    </nav>

    <div class="container mt-5">
      <!-- ================= QR CODE ================= -->
      <h3 class="mb-3">Enter the URL to generate QR code</h3>

      <form method="POST">
        <input type="hidden" name="form_type" value="qr" />

        <div class="mb-3">
          <input
            type="url"
            name="url"
            class="form-control"
            placeholder="https://example.com"
            required
          />
        </div>

        <button type="submit" class="btn btn-primary">Generate QR Code</button>
      </form>

      {% if qr_image %}
      <div class="mt-4">
        <h5>Your QR Code</h5>
        <img src="{{ url_for('static', filename=qr_image) }}" width="200" />
        <div class="mt-2">
          <a
            href="{{ url_for('static', filename=qr_image) }}"
            download
            class="btn btn-success"
          >
            Download
          </a>
        </div>
      </div>
      {% endif %}

      <hr class="my-5" />

      <!-- ================= PDF MERGER ================= -->
      <h3 class="mb-3">PDF Merger</h3>

      <form method="POST" enctype="multipart/form-data">
        <input type="hidden" name="form_type" value="pdf" />

        <div class="mb-3">
          <input
            type="file"
            name="pdfs"
            class="form-control"
            accept="application/pdf"
            multiple
            required
          />
        </div>

        <button type="submit" class="btn btn-primary">Merge PDFs</button>
      </form>

      {% if merged_pdf %}
      <div class="mt-3">
        <a
          href="{{ url_for('static', filename=merged_pdf) }}"
          download
          class="btn btn-success"
        >
          Download Merged PDF
        </a>
      </div>
      {% endif %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
